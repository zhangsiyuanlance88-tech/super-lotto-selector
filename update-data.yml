name: 自动更新开奖数据

on:
  schedule:
    # 北京时间 22:30（开奖后约 1 小时）自动运行；UTC = 北京 - 8
    - cron: '30 14 * * *'
  workflow_dispatch:  # 支持在 GitHub 页面手动触发

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 拉取并更新数据
        run: python update_data.py

      - name: 提交变更（有新数据才提交）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lotto_data.js
          if ! git diff --cached --quiet; then
            git commit -m "chore: 自动更新开奖数据 $(date +%Y-%m-%d)"
            git push
          else
            echo "无数据变化，跳过提交"
          fi
