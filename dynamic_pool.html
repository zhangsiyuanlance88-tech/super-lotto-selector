<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>free2.0 动态选号池（避热策略）</title>
<style>
  :root {
    --brand: #1a73e8; --brand-dark: #1557b0; --brand-soft: #eaf1fe;
    --bg: #eef1f6; --card: #ffffff; --ink: #1f2937; --muted: #8a94a6; --line: #e8ebf1;
    --cold: #16a34a; --hot: #2563eb; --mid: #dc2626;
    --shadow: 0 1px 2px rgba(16,24,40,.05), 0 12px 32px rgba(16,24,40,.06);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--ink); max-width: 960px; margin: 0 auto; padding: 18px 20px 48px; -webkit-font-smoothing: antialiased; }
  .hero { background: linear-gradient(135deg, #1a73e8 0%, #2563eb 55%, #3b82f6 100%); color: #fff; border-radius: 14px; padding: 22px 24px; margin-bottom: 18px; box-shadow: 0 10px 30px rgba(26,115,232,.28); }
  .hero-top { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .hero h1 { font-size: 21px; font-weight: 700; color: #fff; letter-spacing: .5px; }
  .badge { font-size: 12px; font-weight: 600; color: #fff; background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.35); padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
  .subtitle { font-size: 13px; color: rgba(255,255,255,.92); line-height: 1.7; }
  .subtitle b { color: #fff; }
  .card { background: var(--card); border-radius: 14px; padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow); border: 1px solid var(--line); }
  .card h2 { font-size: 15px; font-weight: 600; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
  .card h2::before { content: ""; width: 4px; height: 16px; border-radius: 2px; background: var(--brand); }
  .muted { color: var(--muted); font-size: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 9px 10px; text-align: center; border-bottom: 1px solid var(--line); }
  th { background: #f5f7fb; font-weight: 600; color: #475467; }
  .num { font-size: 21px; font-weight: 700; color: var(--brand); font-variant-numeric: tabular-nums; }
  .stat-row { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 12px; }
  .stat-box { flex: 1; min-width: 120px; text-align: center; padding: 14px 12px; background: #f8fafc; border: 1px solid var(--line); border-radius: 10px; }
  .stat-box .num { font-size: 23px; }
  .stat-box .lbl { font-size: 12px; color: var(--muted); margin-top: 5px; }
  .cold .num { color: var(--cold); } .hot .num { color: var(--hot); } .mid .num { color: var(--mid); }
  .controls { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .controls label { font-size: 14px; font-weight: 600; white-space: nowrap; }
  .slider { flex: 1; min-width: 220px; }
  input[type=range] { width: 100%; accent-color: var(--brand); cursor: pointer; }
  .presets { display: flex; gap: 8px; flex-wrap: wrap; }
  .presets button { padding: 7px 15px; border: 1px solid var(--line); background: #fff; border-radius: 999px; cursor: pointer; font-size: 13px; color: #475467; transition: all .15s ease; }
  .presets button:hover { border-color: var(--brand); color: var(--brand); background: var(--brand-soft); }
  .presets button.active { background: var(--brand); color: #fff; border-color: var(--brand); box-shadow: 0 4px 12px rgba(26,115,232,.3); }
  .legend { display: flex; gap: 16px; font-size: 12px; color: #475467; margin: 10px 0 4px; flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .dot.cold { background: var(--cold); } .dot.mid { background: var(--mid); } .dot.hot { background: var(--hot); }
  .dist-zone { font-size: 13px; color: #475467; line-height: 1.7; margin-top: 10px; padding: 12px; background: #f8fafc; border-radius: 10px; }
  .dist-zone b.cold { color: var(--cold); } .dist-zone b.mid { color: var(--mid); } .dist-zone b.hot { color: var(--hot); }
  button.gen { padding: 11px 30px; background: var(--brand); color: #fff; border: none; border-radius: 10px; cursor: pointer; font-size: 15px; font-weight: 600; box-shadow: 0 6px 18px rgba(26,115,232,.3); transition: all .15s ease; }
  button.gen:hover { background: var(--brand-dark); transform: translateY(-1px); }
  button.gen:active { transform: translateY(0); }
  button.gen:disabled { background: #c3c9d4; cursor: not-allowed; box-shadow: none; }
  .copy-btn { padding: 11px 22px; background: #fff; color: var(--brand); border: 2px solid var(--brand); border-radius: 10px; cursor: pointer; font-size: 14px; font-weight: 600; transition: all .15s ease; }
  .copy-btn:hover { background: var(--brand-soft); transform: translateY(-1px); }
  .copy-btn:active { transform: translateY(0); }
  .copy-btn:disabled { color: #a3adbc; border-color: #dfe4ec; background: #f4f6fa; cursor: not-allowed; }
  .copy-btn.copied { background: var(--cold); border-color: var(--cold); color: #fff; }
  .pick-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin: 10px 0; padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: #fafbfd; transition: box-shadow .15s ease; }
  .pick-row:hover { box-shadow: var(--shadow); }
  .balls { display: flex; gap: 6px; }
  .ball { width: 34px; height: 34px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: #fff; box-shadow: inset 0 -2px 4px rgba(0,0,0,.15), 0 2px 4px rgba(0,0,0,.12); }
  .ball.front { background: linear-gradient(160deg, #ef4444, #c41230); }
  .ball.back { background: linear-gradient(160deg, #3b82f6, #1d4ed8); }
  .ball.shadow { box-shadow: inset 0 0 0 2px #ffd54f, 0 0 0 2px rgba(255,213,79,.35), 0 2px 4px rgba(0,0,0,.12); }
  .tag { font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 999px; color: #fff; }
  .tag.cold { background: var(--cold); } .tag.hot { background: var(--hot); }
  .heat-v { font-size: 13px; color: #667085; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .error { color: var(--mid); font-family: ui-monospace, "Cascadia Code", Consolas, monospace; white-space: pre-wrap; }
  svg text { font-size: 10px; fill: #667085; font-family: inherit; }
  .data-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .data-row #dataStatus { flex: 1; min-width: 220px; }
  .refresh-btn { padding: 8px 18px; background: #fff; color: var(--brand); border: 1px solid var(--brand); border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; white-space: nowrap; transition: all .15s ease; }
  .refresh-btn:hover { background: var(--brand-soft); }
  .refresh-btn:disabled { color: #a3adbc; border-color: #dfe4ec; background: #f4f6fa; cursor: not-allowed; }
  #refreshMsg { margin-top: 10px; }
  .refresh-ok { color: var(--cold); font-size: 13px; }
  @media (max-width: 560px) {
    body { padding: 12px 12px 36px; }
    .hero { padding: 18px 16px; }
    .card { padding: 16px; }
    .ball { width: 30px; height: 30px; font-size: 13px; }
  }
</style>
</head>
<body>
<header class="hero">
  <div class="hero-top">
    <h1>free2.0 动态选号池</h1>
    <span class="badge">避热选冷</span>
  </div>
  <p class="subtitle">
    彩民每期投注近似正态分布，集中于“中等热度”组合。<br>
    本工具先按历史极端模式初筛（连号/等差/等比/同尾/奇偶/和值），再按<b>整组热度</b>（前区5号热度之和 + 后区2号热度之和）删除中间段的“大众组合”，
    仅保留两端<b>极冷</b>与<b>极热</b>的冷门组合，中奖时瓜分奖金的人更少。
  </p>
</header>

<div class="card">
  <h2>数据加载</h2>
  <div class="data-row">
    <div id="dataStatus">加载中…</div>
  </div>
  <div id="latestInfo"></div>
</div>

<div class="card">
  <h2>组热度分布（全量组合）</h2>
  <div id="distStat">计算中…</div>
  <div id="distChart" style="margin-top:12px;"></div>
  <div id="distLegend" style="display:none;"></div>
</div>

<div class="card">
  <h2>动态删除：删除“集中投注”的中间热度段</h2>
  <div class="controls">
    <label>删除中间 <b id="zVal">68</b>%</label>
    <div class="slider"><input type="range" id="zSlider" min="0" max="100" value="68" oninput="onZChange(this.value)"></div>
  </div>
  <div class="presets">
    <button class="active" onclick="setZ(68,this)">±1σ（68%）</button>
    <button onclick="setZ(50,this)">±0.67σ（50%）</button>
    <button onclick="setZ(80,this)">±1.28σ（80%）</button>
    <button onclick="setZ(90,this)">±1.64σ（90%）</button>
  </div>
  <div id="cutResult">计算中…</div>
</div>

<div class="card">
  <h2>从保留池随机选号</h2>
  <div class="controls">
    <label>生成组数</label>
    <select id="pickCount">
      <option>1</option><option>3</option><option selected>5</option><option>10</option><option>20</option>
    </select>
    <button class="gen" id="genBtn" onclick="generatePicks()">生成号码</button>
    <button class="copy-btn" id="copyBtn" onclick="copyPicks()" disabled>复制号码</button>
    <button class="copy-btn" id="saveBtn" onclick="savePicks()" disabled>保存号码</button>
  </div>
  <div id="picks"></div>
</div>

<div class="card">
  <h2>保存记录（自动兑奖）</h2>
  <div class="controls">
    <button class="copy-btn" onclick="clearSaved()">清空记录</button>
  </div>
  <div id="savedList"></div>
</div>

<script src="lotto_data.js"></script>
<script>
const weights = { freq: 80, missing: 10, recent: 10, special: 0, consecutive: 0, trend: 0 };
const BW = 0.01;          // 直方图箱宽
let Z = 68;               // 删除中间百分比
let S = null;             // 全局状态

// ==================== 过滤器（复用 pool.html）====================
function maxArith(arr) {
  const d0 = arr[1] - arr[0];
  let is5 = true;
  for (let i = 2; i < 5; i++) if (arr[i] - arr[i-1] !== d0) { is5 = false; break; }
  if (is5) return 5;
  const idxs4 = [[0,1,2,3],[0,1,2,4],[0,1,3,4],[0,2,3,4],[1,2,3,4]];
  for (const ix of idxs4) {
    const d = arr[ix[1]] - arr[ix[0]];
    if (arr[ix[2]] - arr[ix[1]] === d && arr[ix[3]] - arr[ix[2]] === d) return 4;
  }
  const idxs3 = [[0,1,2],[0,1,3],[0,1,4],[0,2,3],[0,2,4],[0,3,4],[1,2,3],[1,2,4],[1,3,4],[2,3,4]];
  for (const ix of idxs3) if (arr[ix[1]] - arr[ix[0]] === arr[ix[2]] - arr[ix[1]]) return 3;
  return 2;
}
function hasGeom(arr) {
  let g = true;
  for (let i = 1; i < 4; i++) if (arr[i] * arr[i] !== arr[i-1] * arr[i+1]) { g = false; break; }
  if (g && arr[1] * arr[1] > arr[0] * arr[0]) return true;
  const idxs4 = [[0,1,2,3],[0,1,2,4],[0,1,3,4],[0,2,3,4],[1,2,3,4]];
  for (const ix of idxs4) {
    const [a,b,c,d] = [arr[ix[0]], arr[ix[1]], arr[ix[2]], arr[ix[3]]];
    if (b * b === a * c && c * c === b * d && b * b > a * a) return true;
  }
  return false;
}
function maxTail(arr) {
  const t = {};
  for (const x of arr) { const k = x % 10; t[k] = (t[k] || 0) + 1; }
  return Math.max(...Object.values(t));
}
function buildFrontPool() {
  const pool = [];
  for (let a = 1; a <= 31; a++)
  for (let b = a+1; b <= 32; b++)
  for (let c = b+1; c <= 33; c++)
  for (let d = c+1; d <= 34; d++)
  for (let e = d+1; e <= 35; e++) {
    // 连号 ≥4
    if ((b-a===1 && c-b===1 && d-c===1) || (c-b===1 && d-c===1 && e-d===1)) continue;
    // 等差 ≥4
    if (maxArith([a,b,c,d,e]) >= 4) continue;
    // 等比
    if (hasGeom([a,b,c,d,e])) continue;
    // 同尾 ≥4
    if (maxTail([a,b,c,d,e]) >= 4) continue;
    // 奇偶极端
    const odd = (a&1) + (b&1) + (c&1) + (d&1) + (e&1);
    if (odd === 0 || odd === 5) continue;
    // 和值极端
    const sum = a+b+c+d+e;
    if (sum < 40 || sum > 150) continue;
    pool.push([a,b,c,d,e]);
  }
  return pool;
}

// ==================== 二分查找 ====================
function lowerBound(a, x) { let lo = 0, hi = a.length; while (lo < hi) { const m = (lo+hi)>>1; if (a[m] < x) lo = m+1; else hi = m; } return lo; } // 首个 >= x
function upperBound(a, x) { let lo = 0, hi = a.length; while (lo < hi) { const m = (lo+hi)>>1; if (a[m] <= x) lo = m+1; else hi = m; } return lo; } // 首个 > x

function commafy(n) { return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

// ==================== 高斯误差函数与逆函数（σ 驱动阈值用）====================
function erf(x) {
  const s = x < 0 ? -1 : 1; x = Math.abs(x);
  const t = 1 / (1 + 0.3275911 * x);
  const r = 1 - (((((1.061405429*t - 1.453152027)*t) + 1.421413741)*t - 0.284496736)*t + 0.254829592)*t*Math.exp(-x*x);
  return s * r;
}
function invErf(p) {
  if (p <= 0) return 0;
  if (p >= 1) return Infinity;
  let lo = 0, hi = 5;
  while (erf(hi) < p) { hi *= 2; if (hi > 100) return Infinity; }
  for (let i = 0; i < 64; i++) { const m = (lo + hi) / 2; if (erf(m) < p) lo = m; else hi = m; }
  return (lo + hi) / 2;
}

// ==================== 主流程 ====================
async function init() {
  try {
    document.getElementById('dataStatus').textContent = '正在获取数据…';
    const records = window.LOTTO_DATA ? window.LOTTO_DATA.records : null;
    if (!records || !records.length) throw new Error('无数据');

    // ---- 单号热度分（复用 free1.0，默认权重仅 freq/missing/recent）----
    const total = records.length;
    document.getElementById('dataStatus').textContent = '已加载 ' + total + ' 期数据（' + records[total-1].period + ' ~ ' + records[0].period + '）';
    // ---- 最新一期信息（开奖日期 + 号码）----
    const latest = records[0];
    const padN = x => String(x).padStart(2, '0');
    const latestInfo = document.getElementById('latestInfo');
    if (latestInfo) {
      const dateTxt = latest.draw_date || '日期未知';
      latestInfo.innerHTML =
        '<span class="muted">最新一期：</span><b>第 ' + latest.period + ' 期</b>' +
        '<span class="muted">（开奖日期 ' + dateTxt + '）</span>' +
        '<div style="margin-top:6px;">前区 <b style="color:#C41230;font-size:16px;">' + latest.front.map(padN).join(' ') + '</b>' +
        '　后区 <b style="color:#1a6fb5;font-size:16px;">' + latest.back.map(padN).join(' ') + '</b></div>';
    }
    const frontStats = {}, backStats = {};
    for (let n = 1; n <= 35; n++) frontStats[n] = { freq:0, lastIdx:-1, recent:0 };
    for (let n = 1; n <= 12; n++) backStats[n]  = { freq:0, lastIdx:-1, recent:0 };
    for (let i = 0; i < total; i++) {
      const d = records[i];
      for (const n of d.front) { frontStats[n].freq++; frontStats[n].lastIdx = i; }
      for (const n of d.back)  { backStats[n].freq++;  backStats[n].lastIdx  = i; }
    }
    for (const d of records.slice(-10)) {
      for (const n of d.front) frontStats[n].recent++;
      for (const n of d.back)  backStats[n].recent++;
    }
    const allFrontFreq = {}, allBackFreq = {};
    for (let n = 1; n <= 35; n++) allFrontFreq[n] = 0;
    for (let n = 1; n <= 12; n++) allBackFreq[n] = 0;
    for (const d of records) {
      for (const n of d.front) allFrontFreq[n]++;
      for (const n of d.back) allBackFreq[n]++;
    }
    function calcScore(stats, allFreq, isBack) {
      const keys = Object.keys(stats).map(Number);
      let maxRecent = 0;
      for (const k of keys) if (stats[k].recent > maxRecent) maxRecent = stats[k].recent;
      let wFreq = weights.freq/100, wMissing = weights.missing/100, wRecent = weights.recent/100;
      if (isBack) { const s = wFreq + wMissing + wRecent; if (s > 0) { wFreq/=s; wMissing/=s; wRecent/=s; } }
      let maxBayes = 0;
      for (const k of keys) { const bf = (allFreq[k]+stats[k].freq)/(total+total); if (bf > maxBayes) maxBayes = bf; }
      const scores = {};
      for (const k of keys) {
        const s = stats[k]; let sc = 0;
        if (wFreq > 0) sc += ((allFreq[k]+s.freq)/(total+total))/(maxBayes||0.01) * wFreq;
        if (wMissing > 0) {
          if (s.lastIdx >= 0) {
            const missing = total-1-s.lastIdx, ratio = Math.min(missing/total, 1);
            let ms;
            if (missing <= 10) ms = ratio*0.5;
            else if (missing <= 20) ms = 0.5 + (ratio-0.2)*0.5;
            else ms = 0.7 + (ratio-0.4)*0.5;
            sc += ms*wMissing;
          } else sc += wMissing;
        }
        if (maxRecent > 0 && wRecent > 0) sc += (s.recent/maxRecent)*wRecent;
        scores[k] = sc;
      }
      return scores;
    }
    const F = calcScore(frontStats, allFrontFreq, false);
    const B = calcScore(backStats, allBackFreq, true);

    // ---- 影子球候选池（走势图热号 = 重号 + 邻号±1 + 近期连号）----
    const fPool = {}, bPool = {};
    const latestF = records[0].front, latestB = records[0].back;
    for (const x of latestF) fPool[x] = '重号';
    for (const x of latestF) {
      if (x - 1 >= 1 && !(x - 1 in fPool)) fPool[x - 1] = '邻号·' + x;
      if (x + 1 <= 35 && !(x + 1 in fPool)) fPool[x + 1] = '邻号·' + x;
    }
    for (let n = 1; n <= 35; n++) {
      let rc = 0; for (let i = 0; i < 6; i++) if (records[i].front.indexOf(n) >= 0) rc++;
      if (rc >= 2 && !(n in fPool)) fPool[n] = '近6期' + rc + '次';
    }
    for (const x of latestB) bPool[x] = '重号';
    for (let n = 1; n <= 12; n++) {
      let rc = 0; for (let i = 0; i < 6; i++) if (records[i].back.indexOf(n) >= 0) rc++;
      if (rc >= 2 && !(n in bPool)) bPool[n] = '近6期' + rc + '次';
    }

    // ---- 构建池子 ----
    const frontPool = buildFrontPool();
    const backPool = []; for (let i = 1; i <= 11; i++) for (let j = i+1; j <= 12; j++) backPool.push([i,j]);

    // ---- 热度求和 ----
    const frontSums = frontPool.map(c => F[c[0]]+F[c[1]]+F[c[2]]+F[c[3]]+F[c[4]]);
    const backSums  = backPool.map(c => B[c[0]]+B[c[1]]);
    const sortedBackSums = [...backSums].sort((a,b)=>a-b);

    // ---- 均值/标准差（两遍法，避免精度损失）----
    let sumF = 0; for (const s of frontSums) sumF += s;
    const meanF = sumF / frontSums.length;
    let varF = 0; for (const s of frontSums) { const d = s - meanF; varF += d*d; } varF /= frontSums.length;
    let sumB = 0; for (const s of backSums) sumB += s;
    const meanB = sumB / backSums.length;
    let varB = 0; for (const s of backSums) { const d = s - meanB; varB += d*d; } varB /= backSums.length;
    const mean = meanF + meanB, std = Math.sqrt(varF + varB);

    // ---- 直方图卷积（分布展示 + 分位数）----
    let fsMin = Infinity, fsMax = -Infinity; for (const s of frontSums) { if (s < fsMin) fsMin = s; if (s > fsMax) fsMax = s; }
    let bsMin = Infinity, bsMax = -Infinity; for (const s of backSums)  { if (s < bsMin) bsMin = s; if (s > bsMax) bsMax = s; }
    const FNB = Math.ceil((fsMax-fsMin)/BW) + 1;
    const histF = new Float64Array(FNB); for (const s of frontSums) histF[Math.floor((s-fsMin)/BW)]++;
    const BNB = Math.ceil((bsMax-bsMin)/BW) + 1;
    const histB = new Float64Array(BNB); for (const s of backSums) histB[Math.floor((s-bsMin)/BW)]++;
    const TNB = FNB + BNB - 1;
    const histT = new Float64Array(TNB);
    for (let ki = 0; ki < FNB; ki++) { if (histF[ki] === 0) continue; for (let kj = 0; kj < BNB; kj++) histT[ki+kj] += histF[ki]*histB[kj]; }
    const lo = fsMin + bsMin, hi = fsMax + bsMax;
    const N = frontSums.length * backSums.length;
    function quantile(q) { const target = q*N; let acc = 0; for (let k = 0; k < TNB; k++) { acc += histT[k]; if (acc >= target) return lo + (k+0.5)*BW; } return hi; }

    S = { F, B, fPool, bPool, frontPool, backPool, frontSums, backSums, sortedBackSums, TNB, histT, lo, hi, N, mean, std, quantile };

    renderDist();
    renderCut();
    const fr = Object.entries(F).sort((a,b)=>b[1]-a[1]);
    const bk = Object.entries(B).sort((a,b)=>b[1]-a[1]);
    document.getElementById('distStat').innerHTML =
      '<table><tr><th>总组合数</th><th>均值 μ</th><th>标准差 σ</th><th>范围</th></tr>' +
      '<tr><td class="num">' + commafy(N) + '</td><td class="num">' + mean.toFixed(4) + '</td><td class="num">' + std.toFixed(4) + '</td><td>' + lo.toFixed(3) + ' ~ ' + hi.toFixed(3) + '</td></tr></table>' +
      '<div class="muted" style="margin-top:6px;">前端最热 5 号：' + fr.slice(0,5).map(x=>x[0]).join('、') + '；后区最热 2 号：' + bk.slice(0,2).map(x=>x[0]).join('、') + '</div>';
    document.getElementById('genBtn').disabled = false;
    renderSaved();
  } catch (e) {
    document.getElementById('dataStatus').innerHTML = '<div class="error">数据加载失败：' + e.message + '</div>' +
      '<div class="muted">请先运行 server.ps1（后端服务），再用 http://localhost:8765/dynamic_pool.html 访问。</div>';
  }
}

// ==================== 删除区阈值 ====================
function getThresholds() {
  // 按 σ 标准差驱动：删除中间 Z% ≈ ±z·σ，z = √2·invErf(Z/100)
  // 中间累积概率 = erf(z/√2) = Z/100
  if (Z <= 0)  return { low: S.mean, high: S.mean, z: 0 };            // 不删除（区间退化）
  if (Z >= 100) return { low: S.lo, high: S.hi, z: Infinity };        // 删除全部
  const z = Math.SQRT2 * invErf(Z / 100);
  const low = Math.max(S.lo, S.mean - z * S.std);                     // 钳制到分布范围内
  const high = Math.min(S.hi, S.mean + z * S.std);
  return { low, high, z };
}
// 精确计数：cold = 热度<low；mid = low<=热度<=high；hot = 热度>high
function countCold(thr) { let c = 0; for (const f of S.frontSums) c += lowerBound(S.sortedBackSums, thr.low - f); return c; }
function countMid(thr)  { let c = 0; for (const f of S.frontSums) c += upperBound(S.sortedBackSums, thr.high - f) - lowerBound(S.sortedBackSums, thr.low - f); return c; }
function countHot(thr)  { let c = 0; for (const f of S.frontSums) c += S.sortedBackSums.length - upperBound(S.sortedBackSums, thr.high - f); return c; }

function onZChange(v) { Z = parseInt(v); document.getElementById('zVal').textContent = Z; updatePresets(); if (S) { renderCut(); renderDist(); } }
function setZ(v, btn) { Z = v; document.getElementById('zSlider').value = v; document.getElementById('zVal').textContent = v; updatePresets(); if (S) { renderCut(); renderDist(); } }
function updatePresets() {
  document.querySelectorAll('.presets button').forEach(b => b.classList.remove('active'));
  const map = { 68:0, 50:1, 80:2, 90:3 };
  if (map[Z] != null) document.querySelectorAll('.presets button')[map[Z]].classList.add('active');
}

// ==================== 渲染 ====================
function renderCut() {
  if (!S) return;
  const thr = getThresholds();
  const cold = countCold(thr), mid = countMid(thr), hot = countHot(thr);
  const keep = cold + hot;
  const keepPct = keep / S.N * 100;
  const ztxt = thr.z === Infinity ? '±∞σ（全部）' : (thr.z === 0 ? '±0σ（不删）' : ('±' + thr.z.toFixed(2) + 'σ'));
  document.getElementById('cutResult').innerHTML =
    '<div class="stat-row">' +
    statBox('删除区间（' + ztxt + '）', thr.low.toFixed(4) + ' ~ ' + thr.high.toFixed(4), 'mid') +
    statBox('保留组数', commafy(keep), '') +
    statBox('保留比例', keepPct.toFixed(2) + '%', '') +
    '</div>' +
    '<div class="stat-row">' +
    statBox('极冷端（热度&lt;下限）', commafy(cold), 'cold') +
    statBox('删除（中间热度）', commafy(mid), 'mid') +
    statBox('极热端（热度&gt;上限）', commafy(hot), 'hot') +
    '</div>' +
    '<div class="dist-zone">本方案在 ' + commafy(S.N) + ' 组合中，删除中间热度段 ' + commafy(mid) +
    ' 组（大众集中投注区域），保留两端 <b class="cold">极冷 ' + commafy(cold) + '</b> 与 <b class="hot">极热 ' + commafy(hot) +
    '</b> 组合，共 <b>' + commafy(keep) + '</b> 组（' + keepPct.toFixed(2) + '%）。</div>';
}
function statBox(lbl, num, cls) {
  return '<div class="stat-box ' + (cls||'') + '"><div class="num">' + num + '</div><div class="lbl">' + lbl + '</div></div>';
}

function renderDist() {
  if (!S) return;
  const thr = getThresholds();
  const { histT, TNB, lo, hi, mean } = S;
  const maxC = Math.max(...histT);
  const W = 900, H = 210, padL = 46, padR = 12, padT = 14, padB = 30;
  const cw = W - padL - padR, ch = H - padT - padB;
  const bw = cw / TNB;
  const binLo = Math.round((thr.low - lo) / BW), binHi = Math.round((thr.high - lo) / BW);
  let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;background:#fff;">';
  for (let k = 0; k < TNB; k++) {
    if (histT[k] === 0) continue;
    const h = histT[k] / maxC * ch;
    const x = padL + k * bw;
    const color = (k < binLo) ? '#2e7d32' : (k > binHi) ? '#1565c0' : '#e53935';
    svg += '<rect x="' + x.toFixed(1) + '" y="' + (padT + ch - h).toFixed(1) + '" width="' + Math.max(bw-0.4, 0.3).toFixed(1) + '" height="' + h.toFixed(1) + '" fill="' + color + '" opacity="0.85"/>';
  }
  // 阈值线
  const xOf = v => padL + (v - lo) / (hi - lo) * cw;
  function vline(v, label, color) {
    const x = xOf(v);
    svg += '<line x1="' + x + '" y1="' + padT + '" x2="' + x + '" y2="' + (padT + ch) + '" stroke="' + color + '" stroke-width="1.2" stroke-dasharray="3,2"/>';
    svg += '<text x="' + x + '" y="' + (H - 8) + '" text-anchor="middle">' + label + '</text>';
  }
  const zl = thr.z === Infinity ? '∞' : thr.z.toFixed(2);
  vline(thr.low, 'μ-' + zl + 'σ', '#e53935');
  vline(mean, 'μ=' + mean.toFixed(3), '#555');
  vline(thr.high, 'μ+' + zl + 'σ', '#e53935');
  // x 轴端点
  svg += '<text x="' + padL + '" y="' + (H - 8) + '" text-anchor="middle">' + lo.toFixed(2) + '</text>';
  svg += '<text x="' + (padL + cw) + '" y="' + (H - 8) + '" text-anchor="end">' + hi.toFixed(2) + '</text>';
  svg += '</svg>';
  document.getElementById('distChart').innerHTML = svg;
  document.getElementById('distLegend').style.display = 'block';
  document.getElementById('distLegend').innerHTML =
    '<div class="legend"><span><span class="dot cold"></span>极冷（保留）</span><span><span class="dot mid"></span>中间热度（删除）</span><span><span class="dot hot"></span>极热（保留）</span></div>';
}

// ==================== 影子球 + 极冷 选号 ====================
// 影子球 = 走势图热号（重号 + 邻号±1 + 近期连号），给整注“走势图合理性”；
// 其余球取宏观冷号/随机，以保证“整注极冷”。命中率仍与随机一致。
function topKeysBy(obj, n, desc) {
  return Object.entries(obj).map(e => [Number(e[0]), e[1]])
    .sort((a, b) => desc ? (b[1] - a[1]) : (a[1] - b[1]))
    .slice(0, n).map(e => e[0]);
}
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function badFrontPattern(arr) {
  if (maxArith(arr) >= 4) return true;
  if (hasGeom(arr)) return true;
  if (maxTail(arr) >= 4) return true;
  const odd = (arr[0]&1) + (arr[1]&1) + (arr[2]&1) + (arr[3]&1) + (arr[4]&1);
  if (odd === 0 || odd === 5) return true;
  const sum = arr[0] + arr[1] + arr[2] + arr[3] + arr[4];
  if (sum < 40 || sum > 150) return true;
  return false;
}
function generatePicks() {
  if (!S) return;
  const n = parseInt(document.getElementById('pickCount').value);
  const thr = getThresholds();
  const { F, B, fPool, bPool } = S;
  const out = [];
  const fPoolKeys = Object.keys(fPool).map(Number);
  const bPoolKeys = Object.keys(bPool).map(Number);

  for (let i = 0; i < n; i++) {
    let picked = null;
    for (let t = 0; t < 600 && !picked; t++) {
      // 前区：2 影子（走势图热号）+ 3 冷门普通（排除走势图热号）
      const fShadow = shuffle(fPoolKeys.slice()).slice(0, 2);
      const fRest = [];
      for (let x = 1; x <= 35; x++) if (!(x in fPool)) fRest.push(x);
      fRest.sort((a, b) => F[a] - F[b]);              // 宏观热度升序
      const fNormal = shuffle(fRest.slice(0, 12)).slice(0, 3);
      const front = [...fShadow, ...fNormal].sort((a, b) => a - b);
      if (badFrontPattern(front)) continue;

      // 后区：1 影子（走势图热号）+ 1 随机
      const bShadow = shuffle(bPoolKeys.slice()).slice(0, 1);
      const bRest = [];
      for (let x = 1; x <= 12; x++) if (!bShadow.includes(x)) bRest.push(x);
      const bNormal = shuffle(bRest.slice()).slice(0, 1);
      const back = [...bShadow, ...bNormal].sort((a, b) => a - b);

      const heat = front.reduce((s, x) => s + F[x], 0) + back.reduce((s, x) => s + B[x], 0);
      if (heat < thr.low) picked = { front, back, heat, shadowFront: fShadow, shadowBack: bShadow };
    }
    if (!picked) continue;
    out.push({ ...picked, zone: 'cold', tag: '极冷·影' });
  }

  let html = '';
  if (!out.length) html = '<div class="muted">当前删除区间下暂无保留组合可生成（请调小删除比例）。</div>';
  for (const p of out) {
    const fMark = new Set(p.shadowFront), bMark = new Set(p.shadowBack);
    html += '<div class="pick-row">' +
      ballsHtml(p.front, 'front', fMark) + '<span style="color:#999;">|</span>' + ballsHtml(p.back, 'back', bMark) +
      '<span class="tag ' + p.zone + '">' + p.tag + '</span>' +
      '<span class="heat-v">组热度 ' + p.heat.toFixed(4) + '</span>' +
      '</div>';
  }
  document.getElementById('picks').innerHTML = html;
  lastPicks = out;
  const copyBtn = document.getElementById('copyBtn');
  copyBtn.disabled = !out.length;
  copyBtn.classList.remove('copied');
  copyBtn.textContent = '复制号码';
  const saveBtn = document.getElementById('saveBtn');
  saveBtn.disabled = !out.length;
}
function ballsHtml(arr, cls, markSet) {
  return '<div class="balls">' + arr.map(x => {
    const mk = (markSet && markSet.has(x)) ? ' shadow' : '';
    return '<span class="ball ' + cls + mk + '">' + String(x).padStart(2, '0') + '</span>';
  }).join('') + '</div>';
}

// ==================== 复制号码 ====================
let lastPicks = [];

function copyPicks() {
  if (!lastPicks.length) return;
  const lines = lastPicks.map(p =>
    p.front.map(x => String(x).padStart(2,'0')).join(' ') + ' + ' + p.back.map(x => String(x).padStart(2,'0')).join(' ')
  );
  const text = lines.join('\n');
  const done = () => {
    const btn = document.getElementById('copyBtn');
    btn.classList.add('copied');
    btn.textContent = '已复制 ✓';
    setTimeout(() => { btn.classList.remove('copied'); btn.textContent = '复制号码'; }, 1500);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}

function fallbackCopy(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); done(); } catch (e) { alert('复制失败，请手动复制'); }
  document.body.removeChild(ta);
}

// ==================== 保存号码 + 自动兑奖 ====================
const SAVE_KEY = 'savedPicks_v2';

function nextPeriod(p) {
  let y = parseInt(p.slice(0, 2));
  let s = parseInt(p.slice(2)) + 1;
  if (s > 153) { y += 1; s = 1; }   // 大乐透每年最多约153期，超过跨年
  return String(y).padStart(2, '0') + String(s).padStart(3, '0');
}

function prizeName(f, b) {
  if (f === 5 && b === 2) return '一等奖';
  if (f === 5 && b === 1) return '二等奖';
  if (f === 5 && b === 0) return '三等奖';
  if (f === 4 && b === 2) return '四等奖';
  if (f === 4 && b === 1) return '五等奖';
  if (f === 3 && b === 2) return '六等奖';
  if (f === 4 && b === 0) return '七等奖';
  if ((f === 3 && b === 1) || (f === 2 && b === 2)) return '八等奖';
  if ((f === 3 && b === 0) || (f === 2 && b === 1) || (f === 1 && b === 2) || (f === 0 && b === 2)) return '九等奖';
  return '未中奖';
}

function savePicks() {
  if (!lastPicks.length) return;
  const records = (window.LOTTO_DATA && window.LOTTO_DATA.records) || [];
  const target = records.length ? nextPeriod(String(records[0].period)) : '';
  const entry = {
    id: Date.now(),
    savedAt: new Date().toLocaleString('zh-CN'),
    targetPeriod: target,
    picks: lastPicks.map(p => ({ front: p.front.slice(), back: p.back.slice() }))
  };
  let list = [];
  try { list = JSON.parse(localStorage.getItem(SAVE_KEY) || '[]'); } catch (e) { list = []; }
  list.unshift(entry);
  localStorage.setItem(SAVE_KEY, JSON.stringify(list));
  renderSaved();
  const btn = document.getElementById('saveBtn');
  btn.classList.add('copied');
  btn.textContent = '已保存 ✓';
  setTimeout(() => { btn.classList.remove('copied'); btn.textContent = '保存号码'; }, 1500);
}

function clearSaved() {
  localStorage.removeItem(SAVE_KEY);
  renderSaved();
}

function renderSaved() {
  const box = document.getElementById('savedList');
  if (!box) return;
  let list = [];
  try { list = JSON.parse(localStorage.getItem(SAVE_KEY) || '[]'); } catch (e) { list = []; }
  if (!list.length) {
    box.innerHTML = '<div class="muted">暂无保存记录。生成号码后点「保存号码」存档，开奖后此处会自动核对。</div>';
    return;
  }
  const byPeriod = {};
  const records = (window.LOTTO_DATA && window.LOTTO_DATA.records) || [];
  for (const r of records) byPeriod[String(r.period)] = r;
  const pad = x => String(x).padStart(2, '0');
  let html = '';
  for (const e of list) {
    const draw = byPeriod[e.targetPeriod];
    html += '<div class="pick-row" style="flex-wrap:wrap;align-items:flex-start;">';
    html += '<div style="width:100%;" class="muted">保存于 ' + (e.savedAt || '') + '　目标期 <b>' + (e.targetPeriod || '—') + '</b>　';
    if (draw) {
      html += '<span style="color:#2e7d32;">开奖号码：前区 ' + draw.front.map(pad).join(' ') + '　后区 ' + draw.back.map(pad).join(' ') + '</span>';
    } else {
      html += '<span style="color:#e53935;">（未开奖，待更新数据后自动核对）</span>';
    }
    html += '</div>';
    for (const p of (e.picks || [])) {
      let result = '';
      if (draw) {
        const fh = p.front.filter(x => draw.front.indexOf(x) >= 0).length;
        const bh = p.back.filter(x => draw.back.indexOf(x) >= 0).length;
        const prize = prizeName(fh, bh);
        result = '<span class="heat-v">中前区 ' + fh + '、后区 ' + bh + ' → <b>' + prize + '</b></span>';
      } else {
        result = '<span class="heat-v">待核对</span>';
      }
      html += '<div style="display:flex;align-items:center;gap:12px;width:100%;">' + ballsHtml(p.front, 'front') + '<span style="color:#999;">|</span>' + ballsHtml(p.back, 'back') + result + '</div>';
    }
    html += '</div>';
  }
  box.innerHTML = html;
}
